<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        nav {
            background-color: #222;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: #00bcd4;
        }

        .container {
            text-align: center;
            padding: 80px 20px;
        }

        input, textarea {
            width: 300px;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 25px;
            background-color: #222;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </nav>

    <div class="container">
        <h1>Contact Us</h1>

        <form>
            <input type="text" placeholder="Enter your name">
            <br>

            <input type="email" placeholder="Enter your email">
            <br>

            <textarea placeholder="Enter your message"></textarea>
            <br>

            <button type="submit">Send Messages</button>
        </form>
    </div>

</body>
</html>
